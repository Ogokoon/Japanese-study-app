<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#BA4231">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>일본어 동사 학습 · 퀴즈</title>
<style>
  :root{
    --bg:#F9F5EA; --card-bg:#FFFCF7; --text-primary:#000000; --text-secondary:#3a3a3a; --text-muted:#6b6b6b;
    --border:#EEDDD3;
    --accent-50:#F7E8E6; --accent-100:#EAC6C1; --accent-200:#D68E83; --accent-600:#BA4231; --accent-900:#541E16;
    --info-bg:#F7E8E6; --info-text:#7A2C20; --info-title:#541E16;
    --gold:#EF9F27; --gold-dark:#BA7517; --tear:#85B7EB;
    --success:#3b6d11; --danger:#A32D2D;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1B1310; --card-bg:#2A1F1A; --text-primary:#f5eee8; --text-secondary:#c9b8ae; --text-muted:#93807a;
      --border:#3f2c24;
      --accent-50:#541E16; --accent-100:#7A2C20; --accent-200:#BA4231; --accent-600:#D68E83; --accent-900:#F7E8E6;
      --info-bg:#541E16; --info-text:#EAC6C1; --info-title:#F7E8E6;
      --success:#8fc45a; --danger:#f0a5a5;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:0; background:var(--bg); color:var(--text-primary);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Malgun Gothic",sans-serif;
    line-height:1.65; -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:480px; margin:0 auto; padding:1.25rem 1rem 5.5rem;}
  .mascot-row{display:flex; justify-content:center; margin-bottom:1rem;}
  .mascot-banner{position:relative; overflow:hidden; background:var(--accent-600); margin:-1.25rem -1rem 1.2rem -1rem; padding:1.6rem 1rem 1.4rem; border-radius:0 0 26px 26px;}
  .mascot-banner .mascot-row{position:relative; z-index:2;}
  .banner-glow{position:absolute; z-index:1; width:190px; height:190px; border-radius:50%; background:rgba(255,255,255,0.15); top:50%; left:50%; transform:translate(-50%,-48%);}
  .banner-paw{position:absolute; z-index:1; opacity:0.24;}
  .banner-star{position:absolute; z-index:1; color:#fff; opacity:0.5;}
  .mascot-banner .mascot-row{margin-bottom:0;}
  .card{background:var(--card-bg); border:0.5px solid var(--border); border-radius:16px; padding:1.3rem 1.35rem; margin-bottom:12px;}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; gap:8px;}
  .word{font-size:28px; font-weight:700; margin:0; color:var(--text-primary);}
  .reading{font-size:17px; color:var(--text-secondary); margin-left:8px; font-weight:400;}
  .meaning{font-size:18px; color:var(--text-secondary); margin:5px 0 0;}
  .badge{font-size:14px; padding:4px 12px; border-radius:999px; white-space:nowrap; background:var(--accent-50); color:var(--info-text); border:0.5px solid var(--accent-100); flex-shrink:0;}
  .rule-box{border-top:0.5px solid var(--border); padding-top:10px; font-size:17px;}
  .rule-box p{margin:0 0 6px; color:var(--text-primary);}
  .rule-label{color:var(--text-secondary); font-weight:600;}
  .rule-note{color:var(--text-muted); font-size:14.5px;}
  .kanji-box{display:flex; gap:12px; align-items:flex-start; background:var(--info-bg); border-radius:12px; padding:12px 14px; margin-top:12px;}
  .kanji-char{font-size:40px; font-weight:700; color:var(--info-title); line-height:1; min-width:46px; text-align:center;}
  .kanji-info{flex:1;}
  .k-title{font-weight:700; margin:0 0 6px; font-size:15.5px; color:var(--info-title);}
  .rtag-row{display:flex; align-items:center; gap:6px; font-size:14px; color:var(--info-text); margin-top:3px;}
  .rtag{display:inline-block; font-size:11px; font-weight:700; padding:2px 6px; border-radius:5px; background:var(--accent-600); color:#fff; flex-shrink:0;}
  .rtag-on{background:var(--gold-dark);}
  .plain-note{background:var(--info-bg); color:var(--info-text); border-radius:12px; padding:12px 14px; margin-top:12px; font-size:15.5px;}
  .example-box{background:var(--card-bg); border:1px dashed var(--accent-200); border-radius:12px; padding:12px 14px; margin-top:10px;}
  .ex-title{font-size:15px; font-weight:600; margin:0 0 9px; color:var(--text-primary);}
  .ex-kanji-row{display:flex; flex-wrap:wrap; gap:8px;}
  .ex-kanji-chip{background:var(--info-bg); color:var(--info-text); border-radius:10px; padding:8px 10px; min-width:130px;}
  .ekc-head{font-weight:700; font-size:16px; color:var(--info-title); margin-bottom:4px;}
  .ekc-mean{font-weight:400; font-size:12.5px; color:var(--text-muted); margin-left:2px;}
  button{
    -webkit-appearance:none; appearance:none; border:1.5px solid var(--accent-600); background:transparent; color:var(--text-primary);
    border-radius:10px; padding:14px 18px; font-size:17px; font-weight:600; min-height:50px;
    font-family:inherit; cursor:pointer; transition:transform .05s ease, background .15s ease;
  }
  button:active{transform:scale(0.97); background:var(--accent-50);}
  .full-btn{width:100%;}
  .hint-btn{border-color:var(--border); color:var(--text-secondary); font-weight:500; padding:14px 16px;}
  input[type=text]{
    flex:1; min-height:50px; border:1.5px solid var(--border); border-radius:10px; padding:0 14px;
    font-size:18px; color:var(--text-primary); background:var(--card-bg); font-family:inherit;
  }
  input[type=text]:focus{outline:none; border-color:var(--accent-600);}
  .quiz-top{display:flex; align-items:center; margin-bottom:1rem; font-size:15px; color:var(--text-secondary); flex-wrap:wrap; gap:8px;}
  .wrong-badge{font-size:13px; color:var(--danger); background:rgba(163,45,45,0.1); padding:3px 10px; border-radius:999px;}
  .hint-count-badge{font-size:13px; color:var(--gold-dark); background:rgba(239,159,39,0.15); padding:3px 10px; border-radius:999px;}
  .quiz-prompt{background:var(--accent-50); border:0.5px solid var(--accent-100); border-radius:16px; padding:2.2rem 1.4rem; text-align:center; margin-bottom:1rem;}
  .quiz-prompt p:first-child{font-size:15px; color:var(--info-text); margin:0 0 10px;}
  .quiz-meaning{font-size:30px; font-weight:700; margin:0; color:var(--info-title);}
  .quiz-sentence{font-size:22px; font-weight:700; margin:0; color:var(--info-title); line-height:1.6;}
  .quiz-sentence-kr{font-size:15px; color:var(--info-text); margin:9px 0 0;}
  .quiz-form-badge{display:inline-block; margin-top:12px; font-size:15px; font-weight:600; padding:5px 16px; border-radius:999px; background:var(--accent-600); color:#fff;}
  .input-row{display:flex; gap:8px; margin-bottom:1rem; flex-wrap:wrap;}
  .input-row input{min-width:140px;}
  .feedback-row{display:flex; align-items:flex-start; gap:10px; min-height:50px;}
  .feedback-text{font-size:17px; font-weight:700;}
  .answer-replay{display:flex; align-items:center; gap:8px; margin-top:6px;}
  .hint-answer-box{display:flex; align-items:center; justify-content:center; gap:10px; background:var(--card-bg); border:0.5px solid var(--border); border-radius:12px; padding:10px 16px; margin:12px 0 16px; position:relative; z-index:1;}
  .ar-text{font-size:16px; font-weight:600; color:var(--text-primary);}
  .speaker-btn{border:none; background:var(--accent-50); border-radius:50%; width:38px; height:38px; font-size:17px; padding:0; min-height:auto; flex-shrink:0;}
  .center{text-align:center;}
  .score-line{font-size:16px; color:var(--text-secondary); margin:0 0 1.5rem;}
  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}
  .hint-panel{background:var(--info-bg); border-radius:16px; padding:1.2rem; margin-bottom:1rem;}
  .hint-msg-jp{text-align:center; font-size:20px; font-weight:700; color:var(--info-title); margin:8px 0 3px;}
  .hint-msg-kr{text-align:center; font-size:13.5px; color:var(--info-text); margin:0 0 14px;}
  .noun-row{display:flex; flex-wrap:wrap; gap:10px; margin-top:10px;}
  .noun-card{background:var(--info-bg); border-radius:12px; padding:10px 12px; min-width:170px; flex:1 1 45%;}
  .nw-head{margin:0 0 8px; font-size:15px; color:var(--info-title);}
  .nw-head b{font-weight:700; font-size:16px;}
  .nw-reading{font-weight:400; font-size:13px; color:var(--info-text);}
  .nw-meaning{font-weight:600; font-size:13.5px; margin-left:4px;}
  .special-note{font-size:12.5px; color:var(--info-text); margin:6px 0 0;}
  .sent-jp{font-size:19px; font-weight:700; margin:0; color:var(--text-primary);}
  .sent-kr{font-size:15px; color:var(--text-secondary); margin:5px 0 0;}
  .verb-ref{font-size:13.5px; color:var(--text-muted); margin-top:10px; border-top:0.5px solid var(--border); padding-top:8px;}
  .verb-hl{color:var(--accent-600);}
  .grammar-box{background:var(--card-bg); border:1px dashed var(--accent-200); border-radius:12px; padding:12px 14px; margin-top:10px;}
  .gb-title{font-weight:700; font-size:14px; color:var(--accent-600); margin:0 0 7px;}
  .gb-list{margin:0; padding-left:18px; font-size:15px; color:var(--text-primary); line-height:1.7;}
  .gb-list li{margin-bottom:4px;}
  .swipe-viewport{overflow:hidden; position:relative; width:100%;}
  .swipe-track{display:flex; will-change:transform;}
  .swipe-slide{flex:0 0 100%; width:100%; box-sizing:border-box;}
  .swipe-nav{display:flex; align-items:center; justify-content:space-between; margin-top:6px; gap:10px;}
  .swipe-nav button{flex:0 0 auto; padding:12px 22px; font-size:20px; min-height:auto;}
  .swipe-nav button:disabled{opacity:0.3; pointer-events:none;}
  .swipe-counter{font-size:16px; color:var(--text-secondary); font-weight:700;}
  .swipe-hint{text-align:center; font-size:12.5px; color:var(--text-muted); margin-top:8px;}
  .tab-bar{position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--accent-600); border-top:none; padding:6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:200;}
  .tab-btn{flex:1; background:none; border:none; padding:8px 2px; font-size:12px; font-weight:600; color:#fff; opacity:0.75; border-radius:10px; min-height:auto;}
  .tab-btn.active{opacity:1; color:var(--accent-600); background:#fff;}
  .tab-num{display:block; font-size:15px; margin-bottom:2px;}
  @keyframes confetti-fall{
    0%{transform:translateY(0) rotate(0deg); opacity:1;}
    100%{transform:translateY(112vh) rotate(720deg); opacity:0;}
  }
  @keyframes cat-dance{
    0%, 100%{transform:rotate(-8deg) translateY(0);}
    25%{transform:rotate(8deg) translateY(-4px);}
    50%{transform:rotate(-6deg) translateY(0);}
    75%{transform:rotate(6deg) translateY(-4px);}
  }
  .cat-dance{display:inline-block; animation:cat-dance 0.5s ease-in-out infinite;}
  @keyframes cat-hop{
    0%, 100%{transform:translate(0,0) rotate(-8deg);}
    25%{transform:translate(-4px,-12px) rotate(9deg);}
    50%{transform:translate(0,-2px) rotate(-7deg);}
    75%{transform:translate(4px,-12px) rotate(8deg);}
  }
  .cat-party{display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-end; gap:4px; margin-bottom:10px;}
  .cat-party > span{display:inline-block; animation:cat-hop 0.62s ease-in-out infinite;}
  .party-note{font-size:22px; color:var(--gold-dark); animation:cat-hop 0.8s ease-in-out infinite;}
  .search-icon-btn{position:absolute; top:1.1rem; left:1rem; z-index:30; border:1.5px solid var(--border); background:var(--card-bg); border-radius:10px; width:38px; height:38px; min-height:auto; padding:0; font-size:16px; display:flex; align-items:center; justify-content:center; opacity:0.92;}
  .modal-backdrop{position:fixed; inset:0; background:rgba(30,12,16,0.5); display:flex; align-items:flex-start; justify-content:center; padding:1.2rem; padding-top:4vh; z-index:500;}
  .modal-box{background:var(--card-bg); border-radius:18px; padding:1.2rem 1.1rem; width:100%; max-width:400px; max-height:80vh; overflow-y:auto; box-shadow:0 12px 40px rgba(0,0,0,0.3);}
  .modal-title{text-align:center; font-size:15px; font-weight:700; color:var(--accent-600); margin:6px 0 12px;}
  .search-results{margin-top:12px;}
  .search-empty{text-align:center; font-size:14px; color:var(--text-muted); padding:14px 0;}
  .search-hit{background:var(--info-bg); border-radius:10px; padding:10px 12px; margin-bottom:8px; cursor:pointer;}
  .search-hit b{font-size:17px; color:var(--info-title);}
  .search-hit span{font-size:13.5px; color:var(--info-text); margin-left:6px;}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="sr-only">고양이와 함께하는 일본어 필수 회화 동사 50개와 예문 학습, 활용형 퀴즈</h1>

  <div id="tab-content-1" style="position:relative;">
    <button class="search-icon-btn" id="v-search-btn" aria-label="단어 검색">🔍</button>
    <div class="mascot-banner"><div class="banner-glow"></div><svg class="banner-paw" style="top:8px;left:16px;transform:rotate(-18deg);" width="22" height="22" viewBox="0 0 24 24"><ellipse cx="12" cy="16" rx="6" ry="5" fill="#fff"/><circle cx="5" cy="7" r="2.6" fill="#fff"/><circle cx="10" cy="4" r="2.6" fill="#fff"/><circle cx="15" cy="4" r="2.6" fill="#fff"/><circle cx="19" cy="7" r="2.6" fill="#fff"/></svg><svg class="banner-paw" style="bottom:10px;right:20px;transform:rotate(16deg);" width="28" height="28" viewBox="0 0 24 24"><ellipse cx="12" cy="16" rx="6" ry="5" fill="#fff"/><circle cx="5" cy="7" r="2.6" fill="#fff"/><circle cx="10" cy="4" r="2.6" fill="#fff"/><circle cx="15" cy="4" r="2.6" fill="#fff"/><circle cx="19" cy="7" r="2.6" fill="#fff"/></svg><svg class="banner-paw" style="top:14px;right:46px;transform:rotate(34deg);" width="14" height="14" viewBox="0 0 24 24"><ellipse cx="12" cy="16" rx="6" ry="5" fill="#fff"/><circle cx="5" cy="7" r="2.6" fill="#fff"/><circle cx="10" cy="4" r="2.6" fill="#fff"/><circle cx="15" cy="4" r="2.6" fill="#fff"/><circle cx="19" cy="7" r="2.6" fill="#fff"/></svg><span class="banner-star" style="position:absolute;top:20px;right:70px;font-size:16px;">✦</span><span class="banner-star" style="position:absolute;bottom:18px;left:34px;font-size:12px;">✦</span><div class="mascot-row" id="mascot-header"></div></div>
    <div class="swipe-viewport" id="verb-viewport"></div>
    <div class="swipe-nav">
      <button id="v-prev">◀</button>
      <span class="swipe-counter" id="v-counter">1 / 50</span>
      <button id="v-next">▶</button>
    </div>
    <p class="swipe-hint">카드를 좌우로 드래그해서 넘길 수 있어요</p>
  </div>

  <div id="tab-content-2" style="display:none">
    <div id="w-start-view">
      <div class="mascot-row" id="w-mascot-start"></div>
      <p class="center" style="color:var(--text-secondary); font-size:15px;">기본형·ます형·て형을 섞어 10문제를 풀어요</p>
      <button id="w-start-btn" class="full-btn">퀴즈 시작하기</button>
    </div>
    <div id="w-quiz-view" style="display:none">
      <div class="quiz-top">
        <span id="w-progress">1 / 10</span>
        <span id="w-wrongbadge"></span>
        <span id="w-hintbadge"></span>
      </div>
      <div class="quiz-prompt">
        <p>이 뜻과 활용형에 맞는 일본어를 입력하세요</p>
        <p class="quiz-meaning" id="w-meaning"></p>
        <span class="quiz-form-badge" id="w-form"></span>
      </div>
      <div class="input-row">
        <input type="text" id="w-input" placeholder="일본어로 입력" autocomplete="off" autocapitalize="off" autocorrect="off">
        <button id="w-submit">제출</button>
        <button id="w-hint" class="hint-btn">힌트</button>
      </div>
      <div class="feedback-row" id="w-feedback"></div>
      <div id="w-hintpanel" style="display:none"></div>
    </div>
    <div id="w-complete-view" class="center" style="display:none; padding:1.5rem 0;">
      <div class="mascot-row" id="w-mascot-complete"></div>
      <p style="font-size:20px; font-weight:700; margin:0 0 8px;">10문제를 모두 완료했습니다</p>
      <p class="score-line" id="w-score"></p>
      <button id="w-restart" class="full-btn">다시 풀기</button>
    </div>
  </div>

  <div id="tab-content-3" style="display:none; position:relative;">
    <button class="search-icon-btn" id="se-search-btn" aria-label="예문 검색">🔍</button>
    <div class="mascot-banner"><div class="banner-glow"></div><svg class="banner-paw" style="top:8px;left:16px;transform:rotate(-18deg);" width="22" height="22" viewBox="0 0 24 24"><ellipse cx="12" cy="16" rx="6" ry="5" fill="#fff"/><circle cx="5" cy="7" r="2.6" fill="#fff"/><circle cx="10" cy="4" r="2.6" fill="#fff"/><circle cx="15" cy="4" r="2.6" fill="#fff"/><circle cx="19" cy="7" r="2.6" fill="#fff"/></svg><svg class="banner-paw" style="bottom:10px;right:20px;transform:rotate(16deg);" width="28" height="28" viewBox="0 0 24 24"><ellipse cx="12" cy="16" rx="6" ry="5" fill="#fff"/><circle cx="5" cy="7" r="2.6" fill="#fff"/><circle cx="10" cy="4" r="2.6" fill="#fff"/><circle cx="15" cy="4" r="2.6" fill="#fff"/><circle cx="19" cy="7" r="2.6" fill="#fff"/></svg><svg class="banner-paw" style="top:14px;right:46px;transform:rotate(34deg);" width="14" height="14" viewBox="0 0 24 24"><ellipse cx="12" cy="16" rx="6" ry="5" fill="#fff"/><circle cx="5" cy="7" r="2.6" fill="#fff"/><circle cx="10" cy="4" r="2.6" fill="#fff"/><circle cx="15" cy="4" r="2.6" fill="#fff"/><circle cx="19" cy="7" r="2.6" fill="#fff"/></svg><span class="banner-star" style="position:absolute;top:20px;right:70px;font-size:16px;">✦</span><span class="banner-star" style="position:absolute;bottom:18px;left:34px;font-size:12px;">✦</span><div class="mascot-row" id="mascot-header-3"></div></div>
    <div class="swipe-viewport" id="sentence-viewport"></div>
    <div class="swipe-nav">
      <button id="se-prev">◀</button>
      <span class="swipe-counter" id="se-counter">1 / 17</span>
      <button id="se-next">▶</button>
    </div>
    <p class="swipe-hint">카드를 좌우로 드래그해서 넘길 수 있어요</p>
  </div>

  <div id="tab-content-4" style="display:none">
    <div id="s-start-view">
      <div class="mascot-row" id="s-mascot-start"></div>
      <p class="center" style="color:var(--text-secondary); font-size:15px;">배운 예문의 빈칸에 들어갈 동사를 맞혀보세요</p>
      <button id="s-start-btn" class="full-btn">퀴즈 시작하기</button>
    </div>
    <div id="s-quiz-view" style="display:none">
      <div class="quiz-top">
        <span id="s-progress">1 / 10</span>
        <span id="s-wrongbadge"></span>
        <span id="s-hintbadge"></span>
      </div>
      <div class="quiz-prompt">
        <p class="quiz-sentence" id="s-sentence"></p>
        <p class="quiz-sentence-kr" id="s-kr"></p>
      </div>
      <div class="input-row">
        <input type="text" id="s-input" placeholder="일본어로 입력" autocomplete="off" autocapitalize="off" autocorrect="off">
        <button id="s-submit">제출</button>
        <button id="s-hint" class="hint-btn">힌트</button>
      </div>
      <div class="feedback-row" id="s-feedback"></div>
      <div id="s-hintpanel" style="display:none"></div>
    </div>
    <div id="s-complete-view" class="center" style="display:none; padding:1.5rem 0;">
      <div class="mascot-row" id="s-mascot-complete"></div>
      <p style="font-size:20px; font-weight:700; margin:0 0 8px;">10문제를 모두 완료했습니다</p>
      <p class="score-line" id="s-score"></p>
      <button id="s-restart" class="full-btn">다시 풀기</button>
    </div>
  </div>
</div>

<div id="search-modal" style="display:none"></div>

<div class="tab-bar">

function catImgTag(mood, size, cls){
  var src = CAT_IMG[mood] || CAT_IMG.neutral;
  return '<img src="' + src + '" width="' + size + '" height="' + size + '" style="width:' + size + 'px;height:' + size + 'px;object-fit:contain;display:inline-block;" class="' + (cls || '') + '" alt="cat">';
}
function cuteCatSVG(mood, size){
  size = size || 56;
  var m = (mood === 'surprised') ? 'surprised' : 'neutral';
  return catImgTag(m, size);
}
function smartCatSVG(size){
  return catImgTag('surprised', size || 56);
}
function strongCatSVG(size){
  return catImgTag('strong', size || 56);
}
function cryingCatSVG(size){
  return catImgTag('crying', size || 56);
}
function catPartyHTML(){
  var moods = ['neutral','surprised','strong','crying','neutral'];
  var inner = '<span class="party-note" style="animation-delay:0.2s">\u266A</span>';
  moods.forEach(function(m, i){
    inner += '<span style="animation-delay:' + (i * 0.14) + 's">' + catImgTag(m, 62) + '</span>';
  });
  inner += '<span class="party-note" style="animation-delay:0.5s">\u266A</span>';
  return '<div class="cat-party">' + inner + '</div>';
}

function readingRows(kun, on){
  var html = '';
  if (kun) html += '<div class="rtag-row"><span class="rtag">訓</span>' + kun + '</div>';
  if (on) html += '<div class="rtag-row"><span class="rtag rtag-on">音</span>' + kataToHira(on) + '</div>';
  return html;
}

function verbCardHTML(v){
  var extra;
  if (v.kanji) {
    extra = '<div class="kanji-box">' +
        '<div style="flex-shrink:0;">' + smartCatSVG(30) + '</div>' +
        '<div class="kanji-char">' + v.kanji + '</div>' +
        '<div class="kanji-info">' +
          '<p class="k-title">' + v.kanjiMeaning + '</p>' +
          readingRows(v.kun, v.on) +
        '</div>' +
      '</div>';
    if (v.exWord) {
      extra += '<div class="example-box"><p class="ex-title">예시 단어 <b>' + v.exWord.jp + '</b>(' + v.exWord.reading + ') ' + v.exWord.meaning + '</p>' +
        '<div class="ex-kanji-row">' + v.exWord.kanjis.map(function(k){
          return '<div class="ex-kanji-chip"><div class="ekc-head">' + k.char + '<span class="ekc-mean">' + k.meaning + '</span></div>' + readingRows(k.kun, k.on) + '</div>';
        }).join('') + '</div></div>';
    }
  } else {
    extra = '<div class="plain-note">한자 없이 히라가나로만 쓰는 고유 동사예요.</div>';
  }
  return '<div class="card">' +
    '<div class="card-top">' +
      '<div><p class="word">' + v.word + '<span class="reading">(' + v.reading + ')</span></p>' +
      '<p class="meaning">' + v.meaning + '</p></div>' +
      '<span class="badge">' + v.group + '</span>' +
    '</div>' +
    '<div class="rule-box">' +
      '<p><span class="rule-label">ます형</span> ' + v.masu + ' <span class="rule-note">(' + v.masuRule + ')</span></p>' +
      '<p><span class="rule-label">て형</span> ' + v.te + ' <span class="rule-note">(' + v.teRule + ')</span></p>' +
    '</div>' + extra +
  '</div>';
}

function makeSwiper(opts){
  var index = 0;
  var track = null;
  var viewportWidth = 0;
  var dragStartX = null, dragStartY = null, dragDX = 0, dragging = false, dragLocked = null;
  // own display order; never mutate the shared source array (sentences reference verbs by index)
  var order = opts.items.slice();

  function buildSlides(){
    var prevHtml = index > 0 ? opts.renderItem(order[index - 1]) : '<div class="card" style="visibility:hidden;"></div>';
    var curHtml = opts.renderItem(order[index]);
    var nextHtml = index < order.length - 1 ? opts.renderItem(order[index + 1]) : '<div class="card" style="visibility:hidden;"></div>';
    return '<div class="swipe-slide">' + prevHtml + '</div><div class="swipe-slide">' + curHtml + '</div><div class="swipe-slide">' + nextHtml + '</div>';
  }

  function updateNav(){
    opts.counterEl.textContent = (index + 1) + ' / ' + order.length;
    opts.prevBtn.disabled = index === 0;
    opts.nextBtn.disabled = index === order.length - 1;
  }

  function renderTrack(){
    opts.viewportEl.innerHTML = '<div class="swipe-track">' + buildSlides() + '</div>';
    track = opts.viewportEl.querySelector('.swipe-track');
    viewportWidth = opts.viewportEl.clientWidth || 320;
    track.style.transition = 'none';
    track.style.transform = 'translateX(-' + viewportWidth + 'px)';
    updateNav();
  }

  function snapBack(){
    if (!track) return;
    track.style.transition = 'transform 0.2s ease';
    track.style.transform = 'translateX(-' + viewportWidth + 'px)';
  }

  function reactSurprised(){
    if (!opts.mascotEl) return;
    var img = opts.mascotEl.querySelector('img');
    if (!img) return;
    var original = img.getAttribute('data-original-src') || img.src;
    img.setAttribute('data-original-src', original);
    img.src = CAT_IMG.neutralSurprised;
    setTimeout(function(){ img.src = original; }, 500);
  }

  function animateTo(dir){
    if (!track) return;
    if (dir === 1 && index >= order.length - 1) { snapBack(); return; }
    if (dir === -1 && index <= 0) { snapBack(); return; }
    reactSurprised();
    track.style.transition = 'transform 0.28s ease';
    track.style.transform = 'translateX(' + (dir === 1 ? -(viewportWidth * 2) : 0) + 'px)';
    setTimeout(function(){
      index += dir;
      renderTrack();
    }, 280);
  }

  opts.prevBtn.addEventListener('click', function(){ animateTo(-1); });
  opts.nextBtn.addEventListener('click', function(){ animateTo(1); });

  opts.viewportEl.addEventListener('touchstart', function(e){
    if (!track) return;
    dragStartX = e.touches[0].clientX;
    dragStartY = e.touches[0].clientY;
    dragLocked = null;
    dragging = true;
    track.style.transition = 'none';
  }, { passive: true });
  opts.viewportEl.addEventListener('touchmove', function(e){
    if (!dragging || !track) return;
    var dx = e.touches[0].clientX - dragStartX;
    var dy = e.touches[0].clientY - dragStartY;
    if (dragLocked === null) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      dragLocked = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
    }
    if (dragLocked === 'v') return;
    if (e.cancelable) e.preventDefault();
    if (index === 0 && dx > 0) dx *= 0.35;
    if (index === order.length - 1 && dx < 0) dx *= 0.35;
    dragDX = dx;
    track.style.transform = 'translateX(' + (-viewportWidth + dx) + 'px)';
  }, { passive: false });
  opts.viewportEl.addEventListener('touchend', function(){
    if (!dragging) return;
    dragging = false;
    if (dragLocked === 'h') {
      var threshold = viewportWidth * 0.18;
      if (dragDX <= -threshold) animateTo(1);
      else if (dragDX >= threshold) animateTo(-1);
      else snapBack();
    }
    dragDX = 0;
    dragLocked = null;
  }, { passive: true });

  return {
    init: renderTrack,
    goNext: function(){ animateTo(1); },
    goPrev: function(){ animateTo(-1); },
    reshuffle: function(){
      shuffle(order);
      index = 0;
      renderTrack();
    },
    jumpTo: function(item){
      var i = order.indexOf(item);
      if (i < 0) return;
      index = i;
      renderTrack();
    }
  };
}

function shuffle(arr){
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

function playFireworkSound(){
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    for (var i = 0; i < 3; i++) {
      (function(idx){
        setTimeout(function(){
          var o = ctx.createOscillator();
          var g = ctx.createGain();
          o.type = 'triangle';
          var startFreq = 700 + Math.random() * 500;
          o.frequency.setValueAtTime(startFreq, ctx.currentTime);
          o.frequency.exponentialRampToValueAtTime(70, ctx.currentTime + 0.18);
          g.gain.setValueAtTime(0.28, ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
          o.connect(g); g.connect(ctx.destination);
          o.start(); o.stop(ctx.currentTime + 0.22);
        }, idx * 90);
      })(i);
    }
  } catch (e) {}
}
function launchConfetti(big){

  document.body.appendChild(container);

function setupQuiz(cfg){
  var state = { session: [], idx: 0, correct: 0, answers: [], displayAnswer: '', speakText: '', wrongRecorded: false, hintRecorded: false, key: '' };

  cfg.startBtn.addEventListener('click', function(){
    cfg.startView.style.display = 'none';
    cfg.quizView.style.display = 'block';
    state.idx = 0; state.correct = 0;
    state.session = cfg.buildSession();
    showQ();
  });
  cfg.restartBtn.addEventListener('click', function(){
    cfg.completeView.style.display = 'none';
    cfg.startView.style.display = 'block';
  });
  cfg.submitBtn.addEventListener('click', check);
  cfg.input.addEventListener('keydown', function(e){ if (e.key === 'Enter') check(); });
  cfg.hintBtn.addEventListener('click', showHint);

  function showQ(){
    cfg.hintPanel.style.display = 'none';
    cfg.hintPanel.innerHTML = '';
    cfg.input.style.display = '';
    cfg.submitBtn.style.display = '';
    cfg.hintBtn.style.display = '';
    cfg.feedback.innerHTML = '';
    state.wrongRecorded = false;
    state.hintRecorded = false;
    if (state.idx >= state.session.length) {
      cfg.quizView.style.display = 'none';
      cfg.completeView.style.display = 'block';
      cfg.mascotComplete.innerHTML = catPartyHTML();
      cfg.scoreEl.textContent = state.correct + ' / ' + state.session.length + '개 정답';
      launchConfetti(true);
      playFireworkSound();
      return;
    }
    var q = cfg.getQuestion(state.session[state.idx]);
    state.answers = q.answers;
    state.key = q.key;
    state.displayAnswer = q.displayAnswer;
    state.speakText = q.speakText;
    cfg.progressEl.textContent = (state.idx + 1) + ' / ' + state.session.length;
    var wc = counts[cfg.storeGroup].wrong[q.key] || 0;
    var hc = counts[cfg.storeGroup].hint[q.key] || 0;
    cfg.wrongBadge.innerHTML = wc > 0 ? '<span class="wrong-badge">이전에 ' + wc + '번 틀렸어요</span>' : '';
    cfg.hintBadge.innerHTML = hc > 0 ? '<span class="hint-count-badge">★×' + hc + '회</span>' : '';
    cfg.render(q);
    cfg.input.value = '';
    cfg.input.focus();
  }

  function recordWrongSubmit(){
    if (state.wrongRecorded) return;
    state.wrongRecorded = true;
    var g = counts[cfg.storeGroup].wrong;
    g[state.key] = (g[state.key] || 0) + 1;
    saveCounts();
  }
  function recordHintUsed(){
    if (state.hintRecorded) return;
    state.hintRecorded = true;
    var g = counts[cfg.storeGroup].hint;
    g[state.key] = (g[state.key] || 0) + 1;
    saveCounts();
  }

  function check(){
    var val = cfg.input.value.trim();
    if (!val) return;
    if (state.answers.indexOf(val) !== -1) {
      cfg.input.style.display = 'none';
      cfg.submitBtn.style.display = 'none';
      cfg.hintBtn.style.display = 'none';
      cfg.feedback.innerHTML = '<span class="cat-dance">' + cuteCatSVG('happy', 40) + '</span>' +
        '<div><span class="feedback-text" style="color:var(--success)">정답입니다!</span>' +
        '<div class="answer-replay"><span class="ar-text">' + state.displayAnswer + '</span>' +
        '<button type="button" class="speaker-btn" id="' + cfg.prefix + '-replay">🔊</button></div></div>';
      document.getElementById(cfg.prefix + '-replay').addEventListener('click', function(){ speak(state.speakText); });
      cfg.hintPanel.innerHTML = '<button id="' + cfg.prefix + '-next-btn" class="full-btn" style="margin-top:12px;">확인 — 다음 문제</button>';
      cfg.hintPanel.style.display = 'block';
      document.getElementById(cfg.prefix + '-next-btn').addEventListener('click', function(){
        state.idx++;
        showQ();
      });
      launchConfetti(false);
      playFireworkSound();
      state.correct++;
    } else {
      recordWrongSubmit();
      cfg.input.style.display = 'none';
      cfg.submitBtn.style.display = 'none';
      cfg.hintBtn.style.display = 'none';
      cfg.feedback.innerHTML = cryingCatSVG(40) +
        '<div><span class="feedback-text" style="color:var(--danger)">오답입니다</span>' +
        '<div class="answer-replay"><span class="ar-text">' + state.displayAnswer + '</span>' +
        '<button type="button" class="speaker-btn" id="' + cfg.prefix + '-wrong-replay">🔊</button></div></div>';
      document.getElementById(cfg.prefix + '-wrong-replay').addEventListener('click', function(){ speak(state.speakText); });
      cfg.hintPanel.innerHTML = '<button id="' + cfg.prefix + '-wrong-next" class="full-btn" style="margin-top:12px;">확인 — 다음 문제</button>';
      cfg.hintPanel.style.display = 'block';
      document.getElementById(cfg.prefix + '-wrong-next').addEventListener('click', function(){
        state.idx++;
        showQ();
      });
    }
  }

  function showHint(){
    recordHintUsed();
    cfg.input.style.display = 'none';
    cfg.submitBtn.style.display = 'none';
    cfg.hintBtn.style.display = 'none';
    cfg.feedback.innerHTML = '';
    var panelHtml = '<div class="hint-panel"><div class="mascot-row">' + strongCatSVG(60) + '</div>' +
      '<div class="hint-answer-box"><span class="ar-text">' + state.displayAnswer + '</span>' +
      '<button type="button" class="speaker-btn" id="' + cfg.prefix + '-hint-speaker">🔊</button></div>' +
      cfg.hintExplain() +
      '<button id="' + cfg.prefix + '-confirm" class="full-btn" style="margin-top:12px;">확인</button></div>';
    cfg.hintPanel.innerHTML = panelHtml;
    cfg.hintPanel.style.display = 'block';
    document.getElementById(cfg.prefix + '-hint-speaker').addEventListener('click', function(){ speak(state.speakText); });
    document.getElementById(cfg.prefix + '-confirm').addEventListener('click', function(){
      state.idx++;
      showQ();
    });
  }

  return {
    abandon: function(){
      if (cfg.quizView.style.display === 'block') {
        cfg.quizView.style.display = 'none';
        cfg.completeView.style.display = 'none';
        cfg.startView.style.display = 'block';
        state.idx = 0; state.correct = 0;
      }
    }
  };
}

function renderSearchResults(query){
  var box = document.getElementById('search-results');
  if (!box) return;
  var q = query.trim().toLowerCase();
  if (!q) { box.innerHTML = '<p class="search-empty">단어나 뜻을 입력해보세요</p>'; return; }
  var hits = [];
  if (searchMode === 'verb') {
    verbs.forEach(function(v, i){
      var hay = [v.word, v.reading, v.meaning, v.masu, v.masuReading, v.te, v.teReading, v.kanji || ''].join(' ').toLowerCase();
      if (hay.indexOf(q) !== -1) hits.push({ i: i, label: v.word, sub: v.reading + ' · ' + v.meaning });
    });
  } else {
    sentences.forEach(function(s, i){
      var hay = [s.jp, s.kr, s.blank, s.blankReading].join(' ').toLowerCase();
      if (hay.indexOf(q) !== -1) hits.push({ i: i, label: s.jp, sub: s.kr });
    });
  }
  if (!hits.length) { box.innerHTML = '<p class="search-empty">찾는 단어가 없어요</p>'; return; }
  box.innerHTML = hits.slice(0, 12).map(function(h){
    return '<div class="search-hit" data-idx="' + h.i + '"><b>' + h.label + '</b><span>' + h.sub + '</span></div>';
  }).join('');
  box.querySelectorAll('.search-hit').forEach(function(el){
    el.addEventListener('click', function(){
      var idx = parseInt(el.getAttribute('data-idx'), 10);
      if (searchMode === 'verb') verbSwiper.jumpTo(verbs[idx]);
      else sentSwiper.jumpTo(sentences[idx]);
      closeSearch();
    });
  });
}

}

document.getElementById('v-search-btn').addEventListener('click', function(){ openSearch('verb'); });
document.getElementById('se-search-btn').addEventListener('click', function(){ openSearch('sentence'); });

var currentTab = '1';
document.querySelectorAll('.tab-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    var n = btn.getAttribute('data-tab');
    var prevTab = currentTab;
    if (currentTab === '2' && n !== '2') wordQuizCtl.abandon();
    if (currentTab === '4' && n !== '4') sentQuizCtl.abandon();
    currentTab = n;
    for (var i = 1; i <= 4; i++) {
      document.getElementById('tab-content-' + i).style.display = (String(i) === n) ? 'block' : 'none';
    }
    if (n === '3' && !sentSwiperInited) {
      sentSwiper.init();
      sentSwiperInited = true;
    } else if (n === '3' && prevTab !== '3') {
      sentSwiper.reshuffle();
    }
    if (n === '1' && prevTab !== '1') {
      verbSwiper.reshuffle();
    }
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    window.scrollTo(0, 0);
  });
});
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('service-worker.js').catch(function(){});
  });
}
</script>
